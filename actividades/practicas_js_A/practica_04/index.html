<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practica 3 - Ej_6: Nomina Semanal</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3f0;
      --shadow: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f7f9fc 100%);
      color: var(--text);
    }

    h1, h2 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--text);
    }

    form {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 10px 28px var(--shadow);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text);
    }

    label:first-of-type {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(59, 130, 246, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    hr {
      width: min(100%, 420px);
      margin: 24px auto 16px;
      border: none;
      border-top: 1px solid var(--border);
    }

    #resultado {
      min-height: 24px;
      width: min(100%, 420px);
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.15);
      color: var(--text);
      font-weight: 500;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Cálculo de Pago de Nomina</h1>

  <form id="formulario-pago">
    <label for="empleado">Nombre del empleado:</label>
    <input type="text" id="empleado" required placeholder="Ej. Mario Zapata">

    <label for="horas">Total de horas trabajadas:</label>
    <input type="number" id="horas" step="1" min="1" required placeholder="0">

    <label for="pago_hora">Pago por una hora trabajada ($):</label>
    <input type="number" id="pago_hora" step="10" min="0" required placeholder="0">

    <button type="submit">Calcular</button>
  </form>

  <hr>

  <div id="resultado">Esperando datos...</div>

  <script src="appE6.js"></script>
</body>
</html>
