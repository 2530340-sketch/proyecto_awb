<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Notas Rápidas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="panel">

        <h1>Notas Aplicaciones Web</h1>

        <form id="formulario">
            <input
                type="text"
                name="titulo"
                placeholder="Título"
                required
            >

            <textarea
                name="contenido"
                placeholder="Contenido de la nota"
                required
            ></textarea>

            <button id="guardarNota" type="submit">
                Guardar Nota
            </button>

            <button
                id="cancelarEdicion"
                type="button"
                hidden
            >
                Cancelar Edición
            </button>

        </form>
        <section id="notas"></section>
        <p
            id="estado"
            role="status"
            aria-live="polite"
        ></p>
    </main>
</body>
</html>
