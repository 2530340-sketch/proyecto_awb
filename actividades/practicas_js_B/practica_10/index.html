<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta del curso</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3f0;
      --shadow: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f7f9fc 100%);
      color: var(--text);
    }

    h1, h2 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--text);
    }

    form {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 10px 28px var(--shadow);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text);
    }

    label:first-of-type {
      margin-top: 0;
    }

    input,
select,
button {
padding: 11px;
border: 1px solid #b9c9df;
border-radius: 8px;
font: inherit;
}

    input:not([type="radio"]),
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
      font-family: inherit;
    }

    input:not([type="radio"]):focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    textarea {
      resize: vertical;
    }

    fieldset {
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 8px;
      font-weight: 600;
    }

    .calificaciones {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .calificaciones label {
      position: relative;
      margin: 0;
      cursor: pointer;
    }

    .calificaciones input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .calificaciones span {
      display: grid;
      min-height: 44px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-weight: 700;
    }

    .calificaciones input:checked + span {
      border-color: var(--primary-dark);
      background: var(--primary-dark);
      color: #fff;
    }

    .calificaciones input:focus-visible + span {
      outline: 3px solid rgba(59, 130, 246, 0.3);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(59, 130, 246, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
    }

    hr {
      width: min(100%, 420px);
      margin: 24px auto 16px;
      border: none;
      border-top: 1px solid var(--border);
    }

    #resultado {
      min-height: 24px;
      width: min(100%, 420px);
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.15);
      color: var(--text);
      font-weight: 500;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Encuesta del curso</h1>

  <form id="formulario-encuesta">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Mario Zapata">

    <label for="grupo">Grupo:</label>
    <input type="text" id="grupo" name="grupo" required placeholder="Ej. 4 - 3">

    <label for="tema">Tema favorito del curso:</label>
    <select name="tema" required>
        <option value="">Seleccione un tema</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
      </select>

    <fieldset>
      <legend>¿Qué calificación le das al curso?</legend>
      <div class="calificaciones">
        <label><input type="radio" name="calificacion" value="1" required><span>1</span></label>
        <label><input type="radio" name="calificacion" value="2"><span>2</span></label>
        <label><input type="radio" name="calificacion" value="3"><span>3</span></label>
        <label><input type="radio" name="calificacion" value="4"><span>4</span></label>
        <label><input type="radio" name="calificacion" value="5"><span>5</span></label>
      </div>
    </fieldset>

    <label for="comentario">Comentario:</label>
    <textarea id="comentario" name="comentario" rows="4" placeholder="Comparte tu comentario"></textarea>

    <button type="submit">Enviar encuesta</button>
  </form>

  <hr>

  <div id="resultado" aria-live="polite">Aún no hay una encuesta guardada.</div>

  <script src="app.js"></script>
</body>
</html>
