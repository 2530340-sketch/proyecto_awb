        <html>
        <head>
            <title>Proyecto AW</title>
            <link rel="stylesheet" href="style.css">
            <body>
            <main class="panel">
            <h2>Nueva Actividad</h2>

                <form id = "formulario">
                <label for="titulo">Titulo</label>
                <br>
                <input type="text"
                        name="titulo"
                        placeholder="Ej. Proyecto de Aw"
                        maxlength="50"
                        required>
                        <br><br>


                        <label for="materia">Materia</label>
                        <br>
                        <input type="text"
                                name="materia"
                                placeholder="Ej. Aplicaciones Web"
                                maxlength="40"
                                required>
                                <br><br>

                                <label for="descripcion">Descripcion</label>
                                <textarea
                                        name="descripcion"
                                        placeholder="Ej. Descripción del proyecto"
                                        maxlength="300"
                                        required>
                                </textarea>
                                <br><br>

                                <label for="fecha">Fecha de entrega</label>
                                <br>
                                <input type="date"
                                        name="fecha"
                                        required>
                                        <br><br>

                                        <select name = "Estatus">   
                                            <option value="pendiente">pendiente</option>
                                            <option value="en progreso">en progreso</option>
                                            <option value="completado">completado</option>
                                        </select>
                                        

                                        
                                        <select name = "prioridad">   
                                            <option value="Baja">Baja</option>
                                            <option value="Media">Media</option>
                                            <option value="Alta">Alta</option>
                                        </select>

                                     <button id="guardarNota" type="submit">
                                            Guardar Nota
                                        </button>


                                        </form>



                                            <form id="formulario2">
                                             <label for="buscar">Buscar titulo o materia</label>
                                             <input id="buscar" placeholder="Buscar" type="text"/>

                                            <select name="Estatus2">   
                                                <option value="">Todos los estatus</option>
                                                <option value="pendiente">pendiente</option>
                                                <option value="en progreso">en progreso</option>
                                                <option value="completado">completado</option>
                                            </select>
                                            
                                            <select name="prioridad2">   
                                                <option value="">Todas las prioridades</option>
                                                <option value="Baja">Baja</option>
                                                <option value="Media">Media</option>
                                                <option value="Alta">Alta</option>
                                            </select>
                                        </form>

                                        <div id="resultado"></div>
                               <div id="resultado2"></div>



                                

                            
            </body>
            <script src="app.js"></script>
        </html>
