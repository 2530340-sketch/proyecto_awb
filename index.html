<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto AW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="panel">

        <!-- menu superior para la Practica 5  -->
        <div class="contenedor-menu-practicas" style="grid-column: 1 / -1;">
            <div class="tarjeta-mini-practica">
                <h4>Practica 05</h4>
                <div class="botones-mini">
                    <button class="btn-mini" onclick="cargarPractica5('alberto')">Alberto</button>
                    <button class="btn-mini" onclick="cargarPractica5('aneth')">Aneth</button>
                </div>
            </div>
        </div>

        <!-- agregar dentro de contenedor-menu-practicas practica 06 -->
        <div class="tarjeta-mini-practica">
            <h4>Practica 06</h4>
            <div class="botones-mini">
                <button class="btn-mini" onclick="cargarPractica6('alberto')">Alberto</button>
                <button class="btn-mini" onclick="cargarPractica6('aneth')">Aneth</button>
            </div>
        </div>

        <!-- agregar dentro de contenedor-menu-practicas -->
        <div class="tarjeta-mini-practica">
            <h4>Practica 07</h4>
            <div class="botones-mini">
                <button class="btn-mini" onclick="cargarPractica7('alberto')">Alberto</button>
                <button class="btn-mini" onclick="cargarPractica7('aneth')">Aneth</button>
            </div>
        </div>

    <!-- contenedor donde aparecera la práctica seleccionada -->
    <div id="contenedorPractica" style="grid-column: 1 / -1; margin-bottom: 20px;"></div>



        
        <h2>Nueva Actividad</h2>

            <form id="formulario">
                <label for="titulo">Titulo</label>
                <br>
                <input type="text" name="titulo" placeholder="Ej. Proyecto de Aw" maxlength="50" required>
                <br><br>

                <label for="materia">Materia</label>
                <br>
                <input type="text" name="materia" placeholder="Ej. Aplicaciones Web" maxlength="40" required>
                <br><br>

                <label for="descripcion">Descripcion</label>
                <br>
                <textarea name="descripcion" placeholder="Ej. Descripción del proyecto" maxlength="300" required></textarea>
                <br><br>

                <label for="fecha">Fecha de entrega</label>
                <br>
                <input type="date" name="fecha" required>
                <br><br>

                <select name="Estatus">   
                    <option value="pendiente">pendiente</option>
                    <option value="en progreso">en progreso</option>
                    <option value="completado">completado</option>
                </select>
                
                <select name="prioridad">   
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>

                <button id="guardarNota" type="submit">Guardar Nota</button>
            </form>

            <form id="formulario2">
               <label for="buscar">Buscar titulo o materia</label>
               <input id="buscar" placeholder="Buscar" type="text"/>

                <select name="Estatus2">   
                    <option value="">Todos los estatus</option>
                    <option value="pendiente">pendiente</option>
                    <option value="en progreso">en progreso</option>
                    <option value="completado">completado</option>
                </select>
                
                <select name="prioridad2">   
                    <option value="">Todas las prioridades</option>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>
            </form>

            <div id="resultado"></div>
            <div id="resultado2"></div>

        </section>

    </main>
</body>
<script src="app.js" defer></script>
</html>
